name: Napi emlékeztető

# Indítók:
#  • Supabase pg_cron → workflow_dispatch (pontos): reggel 07:00 (mode=morning),
#    időpontos teendő kezdése előtt (mode=start)
#  • Supabase adatbázis-trigger → workflow_dispatch: új bejegyzés (mode=change)
#  • GitHub schedule: tartalék a reggeli összefoglalóhoz (a GitHub ezt néha kihagyja/késlelteti)
#  • Kézi indítás: Actions → Run workflow
on:
  schedule:
    - cron: '3,18,33,48 5-9 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Küldés most (reggeli módban: időablak és napi jelző kihagyása, üres napon is küld)'
        type: boolean
        default: true
      dry_run:
        description: 'Csak próba (nem küld semmit, csak kiírja)'
        type: boolean
        default: false
      mode:
        description: 'morning = reggeli összefoglaló, change = új bejegyzés, start = kezdődő teendő'
        type: string
        default: morning
      payload:
        description: 'JSON adat a change/start módhoz (a Supabase tölti ki)'
        type: string
        default: ''

permissions:
  contents: read
  actions: write   # a napi „már elküldve” jelző (cache) mentéséhez

# A reggeli futások egymás után jönnek (napi jelző miatt); a change/start értesítések
# párhuzamosan futhatnak, hogy egyik se vesszen el.
concurrency:
  group: ${{ (inputs.mode || 'morning') == 'morning' && 'reminder-morning' || format('reminder-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MODE: ${{ inputs.mode || 'morning' }}
      PAYLOAD: ${{ inputs.payload }}
      FORCE_SEND: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - name: Mai dátum (Budapest)
        id: day
        run: echo "date=$(TZ=Europe/Budapest date +%F)" >> "$GITHUB_OUTPUT"

      - name: Ma már elküldtük a reggeli összefoglalót?
        id: sent
        if: env.MODE == 'morning'
        uses: actions/cache/restore@v4
        with:
          path: .reminder-sent
          key: reminder-sent-${{ steps.day.outputs.date }}

      - name: Kihagyás
        if: env.MODE == 'morning' && steps.sent.outputs.cache-hit == 'true' && env.FORCE_SEND != 'true'
        run: echo "A mai összefoglaló már kiment ($(cat .reminder-sent)) – nincs teendő."

      - uses: actions/checkout@v4
        if: env.MODE != 'morning' || steps.sent.outputs.cache-hit != 'true' || env.FORCE_SEND == 'true'
        with:
          clean: false

      - uses: actions/setup-node@v4
        if: env.MODE != 'morning' || steps.sent.outputs.cache-hit != 'true' || env.FORCE_SEND == 'true'
        with:
          node-version: 20
          cache: npm

      - name: Függőségek telepítése
        if: env.MODE != 'morning' || steps.sent.outputs.cache-hit != 'true' || env.FORCE_SEND == 'true'
        run: npm ci --omit=dev --no-audit --no-fund

      - name: Értesítés kiküldése
        if: env.MODE != 'morning' || steps.sent.outputs.cache-hit != 'true' || env.FORCE_SEND == 'true'
        run: node scripts/daily-reminder.mjs
        env:
          SENT_MARKER_FILE: ${{ env.MODE == 'morning' && '.reminder-sent' || '' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          APP_URL: ${{ secrets.APP_URL }}
          # Opcionális csatornák – ha nincs beállítva, kimaradnak
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}

      - name: Napi jelző mentése
        if: env.MODE == 'morning' && hashFiles('.reminder-sent') != '' && steps.sent.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .reminder-sent
          key: reminder-sent-${{ steps.day.outputs.date }}
